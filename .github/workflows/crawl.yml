name: crawl-prices

on:
  schedule:
    - cron: "0 */6 * * *"   # 6시간마다 (UTC 기준 00/06/12/18시 = KST 09/15/21/03시), 수 분~수십 분 지연될 수 있음
  workflow_dispatch: {}      # Actions 탭에서 수동 실행

permissions:
  contents: write            # 결과 파일을 레포에 커밋하기 위해 필요

concurrency:
  group: crawl-prices
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium

      - name: Crawl
        run: python crawl.py --ci

      - name: Track lowest prices (closed models)
        run: python track.py

      - name: Build dashboard
        run: python dashboard.py   # output/dashboard.html

      - name: Commit results
        run: |
          git config user.name "price-crawler[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add output   # .gitignore 가 prices_*/raw_*/dump 는 제외
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "prices: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
